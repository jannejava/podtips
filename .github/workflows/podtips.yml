name: Podtips

on:
  schedule:
    - cron: "43 14 * * 1" # Every Monday at 14:43 UTC (15:43 Swedish winter time)
  workflow_dispatch:
    inputs:
      only:
        description: Text in the episode title (empty = all new episodes)
        required: false

permissions:
  contents: write
  id-token: write # For the Claude API login with OIDC, no stored key

concurrency: podtips

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Whisper, markdown and Claude Code
        run: |
          pip install --require-hashes -r requirements.txt
          npm install -g @anthropic-ai/claude-code@2.1.332

      # Only the Whisper models are cached. Transcripts are never cached, logged or committed.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/huggingface
          key: whisper-models-v1

      - name: Run podtips
        env:
          # Not secrets: they name the Anthropic federation rule. Only a run from this repo can use them.
          ANTHROPIC_FEDERATION_RULE_ID: fdrl_01M1uhCiLKw6WkwQYaiVetm5
          ANTHROPIC_ORGANIZATION_ID: a93d9827-95fb-4d57-83db-b5f1b55278aa
          ANTHROPIC_SERVICE_ACCOUNT_ID: svac_01VFGvvHQ5oGmyUF1Yu8dvKT
          ANTHROPIC_WORKSPACE_ID: wrkspc_01UYspndLrQAM9o6ZyAocfuG
          DISABLE_AUTOUPDATER: "1"
          ONLY: ${{ inputs.only }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$ONLY" ]; then
            python podtips.py --only "$ONLY"
          else
            python podtips.py
          fi
