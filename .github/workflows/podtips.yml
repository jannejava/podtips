name: Podtips

on:
  schedule:
    - cron: "0 5 * * 1" # Every Monday at 05:00 UTC
  workflow_dispatch:
    inputs:
      only:
        description: Text in the episode title (empty = all new episodes)
        required: false
  push: # TEST ONLY: remove before merge
    branches: [feat/actions-run]

permissions:
  contents: write
  id-token: write # For the Claude API login with OIDC, no stored key

concurrency: podtips

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Whisper, markdown and Claude Code
        run: |
          pip install faster-whisper "av<19" markdown
          npm install -g @anthropic-ai/claude-code

      # The Whisper models are cached. Transcripts are never logged or committed.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-models-v1

      # TEST ONLY: keep transcripts between test runs. Remove before merge.
      - uses: actions/cache/restore@v4
        with:
          path: transcripts
          key: transcripts-${{ github.run_id }}
          restore-keys: transcripts-

      - name: Run podtips
        env:
          # Not secrets: they name the Anthropic federation rule. Only a run from this repo can use them.
          ANTHROPIC_FEDERATION_RULE_ID: fdrl_01M1uhCiLKw6WkwQYaiVetm5
          ANTHROPIC_ORGANIZATION_ID: a93d9827-95fb-4d57-83db-b5f1b55278aa
          ANTHROPIC_SERVICE_ACCOUNT_ID: svac_01VFGvvHQ5oGmyUF1Yu8dvKT
          ANTHROPIC_WORKSPACE_ID: wrkspc_01UYspndLrQAM9o6ZyAocfuG
          ONLY: ${{ inputs.only || (github.event_name == 'push' && '126.' || '') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$ONLY" ]; then
            python podtips.py --only "$ONLY"
          else
            python podtips.py
          fi

      # TEST ONLY: save the transcripts also when the run fails. Remove before merge.
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: transcripts
          key: transcripts-${{ github.run_id }}
